[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/api/*"
  to = "https://pleasant-pelican-present.ngrok-free.app/api/:splat"
  status = 200
  force = true
  headers = { ngrok-skip-browser-warning = "true" }

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
